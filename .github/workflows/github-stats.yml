name: Update GitHub Stats

on:
  schedule:
    # Executa todos os dias às 03:00 UTC
    # = 00:00 no horário de Brasília
    - cron: "0 3 * * *"

  # Permite executar manualmente pelo GitHub
  workflow_dispatch:

jobs:
  generate-stats:
    name: Generate GitHub Stats
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Baixa o conteúdo do repositório
      - name: Checkout repository
        uses: actions/checkout@v6

      # Cria a pasta onde os SVGs serão armazenados
      - name: Create profile directory
        run: mkdir -p profile

      # Gera o card principal de estatísticas
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}&
            show_icons=true&
            theme=tokyonight&
            include_all_commits=true&
            hide_border=true&
            cache_seconds=86400
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Gera o card das principais linguagens
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}&
            layout=compact&
            langs_count=8&
            theme=tokyonight&
            hide_border=true&
            exclude_repo=DevMobile-Truco&
            cache_seconds=86400
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Salva os SVGs no repositório
      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git diff --cached --quiet || git commit -m "chore: update GitHub stats"

          git push
